[project]
name = "atlas-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
atlas-kit = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5", "import-linter>=2.0"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"

[tool.importlinter]
root_packages = ["atlas_core"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports no module"
type = "forbidden"
source_modules = ["atlas_core"]
forbidden_modules = ["atlas_merit", "atlas_orbit", "atlas_sage"]
