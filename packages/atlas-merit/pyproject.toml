[project]
name = "atlas-merit"
version = "0.1.0"
description = "MERIT: Matching Evidence against Role & Interview Targets"
requires-python = ">=3.11"
dependencies = [
    "atlas-kit",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]

[project.optional-dependencies]
subscription = ["claude-agent-sdk"]
vertex = ["langchain-google-vertexai"]
otel = ["opentelemetry-api", "opentelemetry-sdk", "opentelemetry-instrumentation-fastapi"]
goldenset = ["langsmith>=0.1"]

[project.scripts]
merit = "atlas_merit.cli:app"

[project.entry-points."atlas.modules"]
merit = "atlas_merit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_merit"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["S", "I", "ISC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/atlas_merit/mail.py" = ["BLE001"]
