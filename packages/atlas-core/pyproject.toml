[project]
name = "atlas-kit"
version = "0.1.0"
description = "ATLAS core: profile, exchange contracts and shared services for the career modules"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_core"]
